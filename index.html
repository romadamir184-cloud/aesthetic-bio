
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aesthetic Bio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <!-- Большой хромированный объект -->
        <div class="chrome"></div>

        <!-- Блики -->
        <div class="shine shine-1"></div>
        <div class="shine shine-2"></div>

        <!-- Liquid Glass -->
        <div class="glass glass-1"></div>
        <div class="glass glass-2"></div>
        <div class="glass glass-3"></div>

        <!-- Главный текст -->
        <section class="content">

            <h1 class="title">
                AESTHETIC<br>BIO
            </h1>

            <p class="subtitle">
                PEOPLE · STORIES · MEMORIES
            </p>

            <button class="enter" id="enter">
                ENTER
            </button>

        </section>

        <div class="swipe">
            SWIPE UP ↑
        </div>

        <!-- Переход -->
        <div class="transition-left"></div>
        <div class="transition-right"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
